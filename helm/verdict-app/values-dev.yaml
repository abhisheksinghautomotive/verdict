replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

serviceAccount:
  create: true
  name: "verdict-app"
  annotations:
    eks.amazonaws.com/role-arn: ""

ingress:
  enabled: false

hpa:
  enabled: false

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
