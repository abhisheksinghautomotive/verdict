name: Nightly Teardown

on:
  schedule:
    - cron: "30 17 * * *" # 17:30 UTC = 23:00 IST
  workflow_dispatch:

# Minimal top-level permissions to enforce secure-by-default behavior
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teardown:
    name: Teardown EKS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check if EKS cluster exists
        id: check-eks
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          if aws eks describe-cluster --name verdict-dev --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "EKS cluster verdict-dev is running."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "EKS cluster verdict-dev does not exist."
          fi

      - name: Terraform Init
        if: steps.check-eks.outputs.exists == 'true'
        working-directory: terraform/environments/dev
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=verdict-tfstate-${AWS_ACCOUNT_ID}" \
            -backend-config="dynamodb_table=verdict-tflock" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Destroy EKS
        if: steps.check-eks.outputs.exists == 'true'
        working-directory: terraform/environments/dev
        run: |
          terraform destroy -target=module.eks -auto-approve
